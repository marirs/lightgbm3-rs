name: ci

on: [push, pull_request]

jobs:
  build:
    name: Rust ${{ matrix.os }} ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        rust: [stable]
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - name: Build for Mac
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake libomp
          cargo build --features=openmp --features=polars
      - name: Build for Ubuntu
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev libc++-dev gcc-multilib
          cargo build --features=openmp --features=polars
      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: |
          cargo build --features=openmp --features=polars
      - name: Run tests
        run: cargo test --features=openmp --features=polars
        continue-on-error: ${{ matrix.rust == 'nightly' }}
      - name: Run Clippy
        run: cargo clippy --features=openmp --features=polars -- --no-deps
  format_check:
    name: Run Rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt -- --check
